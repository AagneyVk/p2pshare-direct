name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo test --locked --manifest-path transport-core/Cargo.toml
      - run: cargo build --locked --release --manifest-path transport-core/Cargo.toml --bin p2pshare-engine
      - run: node --test tests/quic-bridge.test.cjs
      - if: runner.os == 'Linux'
        run: cargo build --locked --release --manifest-path transport-core/Cargo.toml --lib
      - if: runner.os == 'Linux'
        run: python3 tests/android-native-interop.py
      - run: cargo run --locked --release --manifest-path transport-core/Cargo.toml --example loopback -- 64
      - uses: actions/upload-artifact@v4
        with:
          name: quic-engine-${{ runner.os }}
          path: |
            transport-core/target/release/p2pshare-engine
            transport-core/target/release/p2pshare-engine.exe

  desktop-and-rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - run: npm test
      - run: cargo test --release --manifest-path native-core/Cargo.toml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: sdkmanager "ndk;28.0.13004108"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-quic-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
