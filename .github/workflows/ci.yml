name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: cargo test --locked --manifest-path transport-core/Cargo.toml
      - run: cargo build --locked --release --manifest-path transport-core/Cargo.toml --bin p2pshare-engine
      - run: node --test tests/quic-bridge.test.cjs
      - if: runner.os == 'Linux'
        run: cargo build --locked --release --manifest-path transport-core/Cargo.toml --lib
      - if: runner.os == 'Linux'
        run: python3 tests/android-native-interop.py
      - run: cargo run --locked --release --manifest-path transport-core/Cargo.toml --example loopback -- 64
      - if: runner.os == 'Linux'
        run: python3 tests/pipeline-benchmark.py
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-benchmark
          path: pipeline-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: quic-engine-${{ runner.os }}
          path: |
            transport-core/target/release/p2pshare-engine
            transport-core/target/release/p2pshare-engine.exe

  desktop-and-rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - run: npm test
      - run: cargo test --release --manifest-path native-core/Cargo.toml
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: p2pshare-windows-installer
          path: release/P2PShare-Setup.exe
          if-no-files-found: error

  android:
    outputs:
      signed-release-ready: ${{ steps.signing.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-quic-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - id: signing
        name: Configure permanent Android update identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.P2PSHARE_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.P2PSHARE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.P2PSHARE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.P2PSHARE_ANDROID_KEY_PASSWORD }}
          SIGNING_SHA256: ${{ secrets.P2PSHARE_ANDROID_SIGNING_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$SIGNING_SHA256" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android release signing is not configured; debug APK remains a test artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/p2pshare-release.jks"
          ACTUAL=$(keytool -exportcert -keystore "$RUNNER_TEMP/p2pshare-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1)
          test "$ACTUAL" = "$SIGNING_SHA256" || { echo 'Android signing fingerprint mismatch'; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.signing.outputs.ready == 'true'
        name: Build signed Android update
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/p2pshare-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.P2PSHARE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.P2PSHARE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.P2PSHARE_ANDROID_KEY_PASSWORD }}
          P2PSHARE_SOURCE_REVISION: ${{ github.sha }}
        run: ./gradlew assembleRelease --no-daemon
      - if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk P2PShare.apk
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p2pshare-android-release
          path: android/P2PShare.apk
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/p2pshare-release.jks"

  publish-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [transport-core, desktop-and-rust, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: p2pshare-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: p2pshare-windows-installer
          path: release-files
      - if: needs.android.outputs.signed-release-ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: p2pshare-android-release
          path: release-files
      - name: Publish tested version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; bump the app version for the next update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' 'Tested P2PShare update. Windows uses the shared QUIC/Rust transport. Android is included only when permanent signing is configured.' > release-notes.txt
          gh release create "$TAG" release-files/* --target "$GITHUB_SHA" --title "P2PShare $VERSION" --prerelease --notes-file release-notes.txt
