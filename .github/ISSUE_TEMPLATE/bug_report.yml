name: Bug report
description: Report a reproducible defect in P2PShare
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For vulnerabilities, stop here and follow SECURITY.md.
  - type: dropdown
    id: path
    attributes:
      label: Transfer path
      options:
        - Desktop to Desktop
        - Desktop to Android
        - Android to Desktop
        - Android to Android
        - Not transfer-related
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: e.g. 6a97ae0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device model, Android version, network topology, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove tickets, credentials, personal paths, and sensitive IP information.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain an active connection ticket or credential.
          required: true
