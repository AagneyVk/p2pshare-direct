name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: impact
    attributes:
      label: Primary area
      options:
        - Transport protocol
        - Desktop application
        - Android application
        - Performance
        - Security
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: invariant
    attributes:
      label: Direct-only invariant
      options:
        - label: This proposal does not require a payload relay, TURN server, or hosted file storage.
          required: true
